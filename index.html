<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Canım Annem</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            /* Gece gökyüzü arka planı */
            background: linear-gradient(to top, #1a0b2e, #000000);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            position: absolute;
            top: 20%;
            color: #fff;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 3rem;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
            opacity: 0;
            animation: fadeIn 3s forwards;
            z-index: 100;
        }

        /* Yazının yavaşça belirmesi */
        @keyframes fadeIn { to { opacity: 1; } }

        /* Çiçeklerin genel yapısı */
        .flower {
            position: absolute;
            bottom: 0; /* Tam ekranın altına yapışık */
            transform-origin: bottom center;
            opacity: 0;
            /* Büyüme animasyonu bittiğinde ekranda kalması için "forwards" */
            animation: grow 2.5s ease-out forwards;
        }

        /* Çiçeklerin alttan büyüme animasyonu */
        @keyframes grow {
            0% { transform: scale(0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Canım Annem Anneler Günün Kutlu Olsun 🌸</h1>

    <script>
        const maxFlowers = 35; // Tam 20 çiçek sınırı
        let count = 0;

        function createFlower() {
            if (count >= maxFlowers) return; // 20'ye ulaşınca dur

            const flower = document.createElement('div');
            flower.className = 'flower';
            
            // Çiçek boyunu ve ekranın neresinden çıkacağını rastgele belirle
            const height = Math.floor(Math.random() * 200 + 250); // 250px - 450px arası boy
            const xPos = Math.random() * 80 + 10; // Ekranın %10 ile %90'ı arasında bir yer
            const delay = count * 0.3; // Her çiçek arasına 0.3 saniye gecikme koy

            flower.style.left = xPos + 'vw';
            flower.style.animationDelay = delay + 's';
            
            // Rastgele güzel çiçek renkleri
            const colors = ['#ff69b4', '#ff1493', '#ff85a2', '#ff4d6d', '#ffb3c1'];
            const petalColor = colors[Math.floor(Math.random() * colors.length)];

            // SVG ile zarif çiçek tasarımı
            flower.innerHTML = `
                <svg width="80" height="${height}" viewBox="0 0 80 ${height}">
                    <path d="M40,${height} Q40,${height/2} 40,40" stroke="#2d5a27" stroke-width="4" fill="none" />
                    <path d="M40,${height-80} Q60,${height-100} 40,${height-120}" fill="#3d7a36" />
                    <path d="M40,${height-60} Q20,${height-80} 40,${height-100}" fill="#3d7a36" />
                    <g transform="translate(40,40)">
                        ${Array.from({length: 8}).map((_, i) => 
                            `<ellipse cx="0" cy="-15" rx="10" ry="20" fill="${petalColor}" transform="rotate(${i * 45})" opacity="0.9" />`
                        ).join('')}
                        <circle cx="0" cy="0" r="8" fill="#ffd700" />
                    </g>
                </svg>
            `;

            document.body.appendChild(flower);
            count++;

            // Eğer 20 olmadıysa 300 milisaniye sonra yeni çiçek üret
            if (count < maxFlowers) {
                setTimeout(createFlower, 300);
            }
        }

        // Animasyonu başlat
        createFlower();
    </script>
</body>
</html>
