<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anneler Günü</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at bottom, #ffe6f0, #ffffff);
    font-family: 'Segoe UI', sans-serif;
}

/* Yazı */
.message {
    position: absolute;
    top: 10%;
    width: 100%;
    text-align: center;
    font-size: 52px;
    color: #d63384;
    font-weight: bold;
    letter-spacing: 1px;
    animation: fadeIn 2s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(-40px);}
    to {opacity:1; transform:translateY(0);}
}

/* Bahçe */
.garden {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 400px;
    display: flex;
    justify-content: space-evenly;
    align-items: flex-end;
}

/* Flower */
.flower {
    width: 140px;
    height: 220px;
}

/* Sap çizimi */
.stem {
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: growStem 2.5s cubic-bezier(.65,0,.35,1) forwards;
}

@keyframes growStem {
    to { stroke-dashoffset: 0; }
}

/* Yaprak */
.leaf {
    transform-origin: center;
    transform: scale(0);
    opacity: 0;
    animation: leafGrow 1s ease forwards, sway 3s ease-in-out infinite;
}

@keyframes leafGrow {
    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* Hafif sallanma */
@keyframes sway {
    0% { transform: rotate(0deg) scale(1);}
    50% { transform: rotate(3deg) scale(1);}
    100% { transform: rotate(0deg) scale(1);}
}

/* Çiçek açma */
.bloom {
    transform-origin: center;
    transform: scale(0);
    animation: bloomOpen 1.2s cubic-bezier(.68,-0.6,.32,1.6) forwards;
}

@keyframes bloomOpen {
    0% { transform: scale(0);}
    70% { transform: scale(1.2);}
    100% { transform: scale(1);}
}
</style>
</head>

<body>

<div class="message">
    Anneler Günün Kutlu Olsun Annem 💖
</div>

<div class="garden" id="garden"></div>

<script>
const garden = document.getElementById("garden");

function createFlower(delay) {

    const color = randomColor();

    const el = document.createElement("div");
    el.className = "flower";

    el.innerHTML = `
    <svg viewBox="0 0 100 200">

        <!-- Sap -->
        <path class="stem"
        d="M50 200 C30 150, 70 120, 50 60"
        stroke="#2e7d32"
        stroke-width="4"
        fill="none"
        style="animation-delay:${delay}s"/>

        <!-- Yapraklar -->
        <ellipse class="leaf"
            cx="35" cy="130" rx="12" ry="6"
            fill="#4caf50"
            style="animation-delay:${delay+1}s"/>

        <ellipse class="leaf"
            cx="65" cy="110" rx="12" ry="6"
            fill="#4caf50"
            style="animation-delay:${delay+1.2}s"/>

        <!-- Çiçek -->
        <g class="bloom" style="animation-delay:${delay+1.8}s">

            <circle cx="50" cy="50" r="8" fill="#ffd54f"/>

            <circle cx="50" cy="30" r="12" fill="${color}"/>
            <circle cx="30" cy="50" r="12" fill="${color}"/>
            <circle cx="70" cy="50" r="12" fill="${color}"/>
            <circle cx="50" cy="70" r="12" fill="${color}"/>

        </g>

    </svg>
    `;

    garden.appendChild(el);
}

function randomColor() {
    const colors = ["#ff4d6d", "#ff85a1", "#ff99cc", "#ffc2d1", "#ff6f91"];
    return colors[Math.floor(Math.random() * colors.length)];
}

// Sinematik sırayla büyüme
for (let i = 0; i < 9; i++) {
    createFlower(i * 0.5);
}
</script>

</body>
</html>
